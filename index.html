<div class="container">

<h1 style="color: white;">OBMC Student Enrollment Form</h1>
<br>
<p style="color: white;">Fill out the form below to enroll for the upcoming school year!</p>
<br>
</div>



<div class="container1">
    <h3>Student Information</h3>
    <br>
    <div class="row gap-3" id="label">

    <div>
        <label for="fname">First name:</label>
        <br>
        <input type="text" id="fname" name="fname" placeholder="First name">
    </div>

    <div>
        <label for="lname">Last name:</label>
        <br>
        <input type="text" id="lname" name="lname" placeholder="Last name">
    </div>
<br>

<div>
        <label for="bday">Birth Date:</label>
        <br>
        <input type="text" id="bday" name="bday" placeholder="mm/dd/yyyy">
</div>

<div>
    <label for="Gender" id="Gender">Gender:</label>
    <br>
    <select name="Gender" id="Gender">
    <option name="Female" value="Female">Female</option>
    <option name="Male" value="Male">Male</option>
    </select>
    <br>
</div>

<div>
<label for="Grade Level:">Grade Level:</label>
<br>
<select name="Grade" id="Grade">
    <option name="Grade" value="Grade 7">Grade 7</option>
    <option name="Grade" value="Grade 8">Grade 8</option>
    <option name="Grade" value="Grade 9">Grade 9</option>
    <option name="Grade" value="Grade 10">Grade 10</option>
</select>
</div>

<h3>Contact Details</h3>

<div>
    <label for="email">Email Address:</label>
    <br>
    <input type="text" id="email" name="email" placeholder="student@example.com">
</div>

<div>
    <label for="Cnumber">Contact Number:</label>
    <br>
    <input type="text" id="Cnumber" name="Cnumber" placeholder="0912-345-6789">
</div>
<br>

<h3>Other Information</h3>

<label for="Mode of Learning:">Mode of Learning:</label>
    <input type="radio" id="learning" name="learning">Online
    <input type="radio" id="learning" name="learning">Face-to-Face
        
    <input type="radio" id="terms" name="terms">I confirm that the information provided is true and complete.
